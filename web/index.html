<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>GeoWorld</title>
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="map" aria-label="Globo interativo"></main>

  <button id="panel-toggle" type="button" aria-controls="layer-panel" aria-expanded="false">Camadas</button>

  <aside id="layer-panel" aria-label="Painel de camadas">
    <h1>GeoWorld</h1>
    <h2>Camadas</h2>
    <ul class="layer-list"></ul>
    <div class="basemap-box">
      <label for="basemap-select">Mapa de fundo</label>
      <select id="basemap-select" class="basemap-select"></select>
    </div>
    <p id="layer-warnings" class="warnings" role="status"></p>
  </aside>

  <button id="spin-toggle" class="spin-toggle" type="button" aria-pressed="false" title="Girar o globo automaticamente">🌐 Girar globo</button>

  <div id="search" class="search-box" role="search">
    <label for="search-input" class="visually-hidden">Buscar vulcão, zona tectônica ou coordenadas</label>
    <input id="search-input" type="search" autocomplete="off" spellcheck="false"
      placeholder="Buscar vulcão, zona ou “lat, lon”"
      aria-controls="search-results" aria-expanded="false" aria-describedby="search-status">
    <ul id="search-results" class="search-results" aria-label="Resultados da busca" hidden></ul>
    <p id="search-status" class="search-status" role="status"></p>
  </div>

  <section id="paleo-bar" class="paleo-bar" aria-label="Paleogeografia" hidden>
    <label class="paleo-head"><input id="paleo-toggle" type="checkbox"> Linhas de costa antigas (0–150 Ma)</label>
    <div class="paleo-controls">
      <button id="paleo-play" type="button" aria-pressed="false">▶ Animar</button>
      <input id="paleo-slider" type="range" aria-label="Idade da reconstrução" aria-describedby="paleo-label">
      <output id="paleo-label" for="paleo-slider"></output>
    </div>
    <div class="paleo-samples-row" hidden>
      <label><input id="paleo-samples-toggle" type="checkbox"> Amostras (GEOROC) na posição de formação</label>
      <span id="paleo-samples-count" class="paleo-credit" role="status"></span>
    </div>
    <div class="paleo-lineaments-row paleo-samples-row" hidden>
      <label><input id="paleo-lineaments-toggle" type="checkbox"> Lineamentos estruturais (falhas: SGB Brasil, CGMW-BRGM África)</label>
    </div>
    <p id="paleo-credit" class="paleo-credit"></p>
    <p id="paleo-status" class="warnings" role="status"></p>
  </section>

  <section id="details-panel" class="details-panel" role="region" aria-label="Detalhes do item selecionado" hidden>
    <button type="button" class="details-close icon-btn" aria-label="Fechar detalhes">✕</button>
    <div class="details-body"></div>
    <p class="details-status" role="status"></p>
  </section>

  <script src="vendor/maplibre-gl.js"></script>
  <script src="vendor/pmtiles.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
